<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ISS Globe Tracker</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    #globe {
      width: 100vw;
      height: 100vh;
    }

    #iss-timer {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.4);
      padding: 6px 10px;
      border-radius: 5px;
      z-index: 1000;
      font-size: 16px;
    }

    /* ---------------------- */
    /* ISS LIVE FEED */
    #iss-live {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 80vw;
      width: 80dvw;
      max-width: 640px;
      height: 50vh;
      height: 50dvh;
      max-height: 360px;
      z-index: 1000;
      border-radius: 8px;
      overflow: hidden;
      background: black;
    }

    #iss-live iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <!-- Timer -->
  <div id="iss-timer">Fetching next approach...</div>

  <!-- Globe -->
  <div id="globe"></div>

  <!-- ISS Live Feed -->
 <!-- ISS Live Feed -->
<div id="iss-live">
  
  <!-- Title overlay -->
  <div class="live-title">Live From The ISS</div>

  <iframe
    src="https://www.youtube.com/embed/uwXgcTc8oY8?autoplay=1&mute=1&playsinline=1&controls=1&rel=0"
    title="ISS Live Feed"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
  </iframe>

</div>

  <!-- Main JS -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
