<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ISS Globe Tracker</title>
  <link rel="stylesheet" href="./src/main.css" />
</head>

<body>
  <!-- Timer -->
  <div id="iss-timer">Fetching next approach...</div>

  <!-- Globe -->
  <div id="globe"></div>

  <!-- ISS Live Feed -->
 <!-- ISS Live Feed -->
<div id="iss-live">
  
  <!-- Title overlay -->
  <div class="live-title">Live From The ISS</div>

  <iframe
    src="https://www.youtube.com/embed/uwXgcTc8oY8?autoplay=1&mute=1&playsinline=1&controls=1&rel=0"
    title="ISS Live Feed"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
  </iframe>

</div>

  <!-- Main JS -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
